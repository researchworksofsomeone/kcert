[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kcert"
version = "0.2.0"
description = "Certified, label-free auditing of the perception layer of rule-based systems: sharp error brackets, certified model selection, drift alarms that cannot be false, and reasoning-shortcut repair."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Satabarto Sarkar"}, {name = "Prithwineel Paul"}]
keywords = ["neuro-symbolic", "expert systems", "model auditing", "partial identification", "distribution shift", "reasoning shortcuts", "certification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/researchworksofsomeone/kcert"
Paper = "https://github.com/researchworksofsomeone/kcert-experiments"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
